name: Watchdog - audit round coverage

# Second, independent safety net. The solver could stop running and say
# nothing: GitHub could disable the schedule, a bad commit could break the
# script, or a run could fail at the push step. This job checks the actual
# contents of main against the published feed and emails me (via a GitHub
# issue) if any round is missing, invalid or misnamed.
#
# It runs three times a day and is also the job that proves the schedule is
# alive at all.
on:
  schedule:
    - cron: "40 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit answer coverage
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/audit.py | tee audit.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Confirm GitHub's scheduler is actually firing
        id: scheduler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The solver is driven by two independent triggers: GitHub's own
          # scheduler and an external caller (docs/external-trigger.md). What
          # matters is that SOMETHING is still driving it, so count both and
          # only alert when the job has gone completely quiet.
          since=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                  || date -u -v-2H +%Y-%m-%dT%H:%M:%SZ)
          sched=$(gh api "repos/${{ github.repository }}/actions/workflows/solve.yml/runs?event=schedule&created=>$since" --jq '.total_count' 2>/dev/null || echo 0)
          disp=$(gh api "repos/${{ github.repository }}/actions/workflows/solve.yml/runs?event=workflow_dispatch&created=>$since" --jq '.total_count' 2>/dev/null || echo 0)
          total=$(( ${sched:-0} + ${disp:-0} ))
          echo "since $since -> schedule: ${sched:-0}, external dispatch: ${disp:-0}"

          if [ "$total" -eq 0 ]; then
            {
              echo ""
              echo "NOTHING has run solve.yml since $since - neither GitHub's"
              echo "scheduler nor the external trigger. Rounds are not being"
              echo "submitted. Check docs/external-trigger.md: the token may have"
              echo "expired, or the cron job may have auto-disabled after repeated"
              echo "failures."
            } | tee -a audit.txt
            echo "code=1" >> "$GITHUB_OUTPUT"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
            # Not an alert, but worth seeing in the log: running on one leg.
            if [ "${sched:-0}" -eq 0 ]; then
              echo "note: GitHub's scheduler is not firing; the external trigger is carrying it"
            fi
            if [ "${disp:-0}" -eq 0 ]; then
              echo "note: no external dispatches; GitHub's scheduler is carrying it"
            fi
          fi

      - name: Confirm the repository is still public
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          echo "private=$private"
          if [ "$private" != "false" ]; then
            echo "REPOSITORY IS NOT PUBLIC - every round would be graded as missing" | tee -a audit.txt
            echo "code=1" >> "$GITHUB_OUTPUT"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise an issue if coverage is incomplete
        if: steps.audit.outputs.code != '0' || steps.visibility.outputs.code != '0' || steps.scheduler.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit.txt', 'utf8').slice(0, 55000);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ALERT: quiz coverage audit found a problem (${new Date().toISOString().slice(0, 16)}Z)`,
              body: `The coverage audit is not clean.\n\n\`\`\`\n${report}\n\`\`\`\n\nRun log: ${url}`,
              labels: ['automation-alert'],
            });

      - name: Fail the run so it shows red in the Actions tab
        if: steps.audit.outputs.code != '0' || steps.visibility.outputs.code != '0' || steps.scheduler.outputs.code != '0'
        run: exit 1
