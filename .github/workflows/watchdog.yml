name: Watchdog - audit round coverage

# Second, independent safety net. The solver could stop running and say
# nothing: GitHub could disable the schedule, a bad commit could break the
# script, or a run could fail at the push step. This job checks the actual
# contents of main against the published feed and emails me (via a GitHub
# issue) if any round is missing, invalid or misnamed.
#
# It runs three times a day and is also the job that proves the schedule is
# alive at all.
on:
  schedule:
    - cron: "40 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit answer coverage
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/audit.py | tee audit.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Confirm the repository is still public
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          echo "private=$private"
          if [ "$private" != "false" ]; then
            echo "REPOSITORY IS NOT PUBLIC - every round would be graded as missing" | tee -a audit.txt
            echo "code=1" >> "$GITHUB_OUTPUT"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise an issue if coverage is incomplete
        if: steps.audit.outputs.code != '0' || steps.visibility.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit.txt', 'utf8').slice(0, 55000);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ALERT: quiz coverage audit found a problem (${new Date().toISOString().slice(0, 16)}Z)`,
              body: `The coverage audit is not clean.\n\n\`\`\`\n${report}\n\`\`\`\n\nRun log: ${url}`,
              labels: ['automation-alert'],
            });

      - name: Fail the run so it shows red in the Actions tab
        if: steps.audit.outputs.code != '0' || steps.visibility.outputs.code != '0'
        run: exit 1
