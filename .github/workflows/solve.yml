name: Solve and submit quiz rounds

# Runs entirely on GitHub's servers - nothing needs to be running on my laptop.
#
# Four times an hour, not once: a scheduled GitHub Actions run can be delayed
# by 10-30 minutes under load, and the questions file itself can lag the
# release by up to five minutes. Four tries an hour keeps every round far
# inside the three-hour 100% timing window even if several runs are late or
# skipped entirely.
on:
  schedule:
    # Every 5 minutes, offset by one, so the slots sit at :01, :06, :11, ...
    #
    # Rounds are released at the top of the hour, but the observed release of
    # round 49 was stamped 21:01:39 and GitHub can take up to five minutes to
    # show it in questions.csv. A run at :00 is therefore too early to be
    # useful, and the old */10 schedule meant waiting until :10.
    #
    # :01 catches the round when the feed updates promptly, and :06 catches it
    # after the worst-case five-minute lag. The rest give ~36 attempts inside
    # each round's three-hour 100% window, of which only one needs to succeed.
    # Public repositories get unlimited Actions minutes; each run is ~15s.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:          # lets me run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/solve.yml"

permissions:
  contents: write             # to commit the answer files
  issues: write               # to open an alert issue if something breaks
  models: read                # free GitHub Models access, for the LLM fallback

# Never let two runs push at once, and never cancel a run that may be
# mid-commit - queue it instead.
concurrency:
  group: solve-quiz
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Solve every unanswered round
        id: solve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: only used if a question matches no known template AND
          # GitHub Models is unavailable. Nothing breaks when it is unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/solve.py

      - name: Commit and push the answers
        id: push
        run: |
          set -euo pipefail
          git config user.name  "dso429-quiz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # On rejection we do NOT try to merge or rebase: a half-resolved
          # conflict could push a file with conflict markers in it, which would
          # be graded as not-submitted. Instead we take the remote as truth,
          # throw our work away and solve again. The solver is deterministic
          # and idempotent, so this always converges on the same answers.
          for attempt in 1 2 3 4 5 6; do
            git add -A answers state
            if git diff --cached --quiet; then
              echo "nothing new to commit"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -q -m "Answers: rounds ${{ steps.solve.outputs.wrote_rounds }}"

            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "push rejected (attempt $attempt) - resetting to origin/main and re-solving"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/solve.py
            sleep $((attempt * 5))
          done

          echo "push failed after 6 attempts"
          exit 1

      - name: Verify the answers really are on main
        if: steps.push.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          # Every answer file we hold must exist in the remote main tree.
          missing=0
          for f in answers/round-*.json; do
            if ! git cat-file -e "origin/main:$f" 2>/dev/null; then
              echo "NOT ON REMOTE: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing answer file(s) did not reach origin/main"
            exit 1
          fi
          echo "all $(ls answers/round-*.json | wc -l) answer files confirmed on origin/main"

      - name: Regression-test the solver
        # Cheap insurance: if a future feed change breaks a formula, this fails
        # and the alert step below emails me.
        run: |
          python3 scripts/test_variants.py
          python3 scripts/validate.py

      - name: Open an alert issue if anything failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ALERT: hourly quiz automation failed';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation-alert',
            });
            const body = `The scheduled solver run failed.\n\nRun log: ${url}\n\nTime: ${new Date().toISOString()}`;
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation-alert'],
              });
            }

      - name: Open an alert issue if a new question type appeared
        # Fires even when a fallback answered it correctly: a new template
        # means an exact formula should be added rather than relying on a
        # fallback for the rest of the week.
        if: success() && steps.solve.outputs.rescued_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.solve.outputs.summary }}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'New question type appeared - answered by fallback';
            // Dedupe: a round inside its three-hour window is re-solved on
            // every run, so creating unconditionally would spam.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'new-template',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Seen again.\n\n\`\`\`json\n${summary}\n\`\`\`\n\n${url}`,
              });
            } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'A question matched no known template, so it was answered by',
                'a fallback (the offline formula search, or the LLM tier if a',
                'key is configured). The round was submitted on time and is',
                'very likely correct, but an exact formula should be added to',
                '`scripts/solve.py` for this type.',
                '',
                'The wording is under `new_templates` below.',
                '',
                '```json',
                summary,
                '```',
                '',
                `Run log: ${url}`,
              ].join('\n'),
              labels: ['automation-alert', 'new-template'],
            });
            }

      - name: Open an alert issue if a question could not be solved at all
        # new_flag_count counts only rounds flagged in THIS run. flagged_count
        # includes rounds locked in earlier runs and would alert forever.
        if: success() && steps.solve.outputs.new_flag_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.solve.outputs.summary }}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ALERT: a quiz question did not match any known template',
              body: [
                'A round was submitted with at least one guessed answer, so a new',
                'question type has probably appeared. The file is valid JSON and',
                'still earns partial credit, and the solver will re-solve the round',
                'automatically for three hours after release - so a fix pushed',
                'within that window is picked up.',
                '',
                '```json',
                summary,
                '```',
                '',
                `Run log: ${url}`,
              ].join('\n'),
              labels: ['automation-alert'],
            });
